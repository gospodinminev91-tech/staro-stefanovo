<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151817" media="(prefers-color-scheme: dark)">
<meta name="description" content="Пътеводител за препоръчана разходка №1 в архитектурен резерват Старо Стефаново — 17 спирки със снимки и карта.">
<meta name="apple-mobile-web-app-title" content="Разходка №1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Разходка №1 · Старо Стефаново</title>
</head>
<body><style>
  :root{
    --ground:#E7E7E1; --surface:#F4F4EF; --surface-2:#DEDFD8;
    --ink:#1E2320; --ink-soft:#5C635B; --ink-faint:#8B918A; --line:#C9CBC2;
    --door:#17566B; --on-door:#F4F4EF; --ochre:#A8712A; --shadow:rgba(30,35,32,.13);
    --live:#2E7DD1; --brand:#E8901A; --act:#A9560A; --on-act:#FFFFFF;
    --map-ground:#EAEAE1; --map-road:#FFFFFF; --map-road-line:#D2D0C3; --map-bld:#DCD8CB; --map-bld-line:#C6C2B4;
    --serif:Georgia,"Iowan Old Style","Noto Serif",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--ground:#151817;--surface:#1E2322;--surface-2:#272D2B;--ink:#E7E8E2;--ink-soft:#A2A9A1;--ink-faint:#767D75;--line:#333A38;--door:#6BB6CE;--on-door:#14201F;--ochre:#D6A05A;--shadow:rgba(0,0,0,.45);--live:#5FA8EE;--brand:#F5A93A;--act:#F0A040;--on-act:#1A1206;--map-ground:#171B1A;--map-road:#333B39;--map-road-line:#222827;--map-bld:#232927;--map-bld-line:#2C3331}
  }
  :root[data-theme="dark"]{--ground:#151817;--surface:#1E2322;--surface-2:#272D2B;--ink:#E7E8E2;--ink-soft:#A2A9A1;--ink-faint:#767D75;--line:#333A38;--door:#6BB6CE;--on-door:#14201F;--ochre:#D6A05A;--shadow:rgba(0,0,0,.45);--live:#5FA8EE;--brand:#F5A93A;--act:#F0A040;--on-act:#1A1206;--map-ground:#171B1A;--map-road:#333B39;--map-road-line:#222827;--map-bld:#232927;--map-bld-line:#2C3331}
  :root[data-theme="light"]{--ground:#E7E7E1;--surface:#F4F4EF;--surface-2:#DEDFD8;--ink:#1E2320;--ink-soft:#5C635B;--ink-faint:#8B918A;--line:#C9CBC2;--door:#17566B;--on-door:#F4F4EF;--ochre:#A8712A;--shadow:rgba(30,35,32,.13);--live:#2E7DD1;--brand:#E8901A;--act:#A9560A;--on-act:#FFFFFF;--map-ground:#EAEAE1;--map-road:#FFFFFF;--map-road-line:#D2D0C3;--map-bld:#DCD8CB;--map-bld-line:#C6C2B4}

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  /* Страницата е lang="bg" и някои шрифтове (Cascadia Mono) подменят кирилицата
     с българските ръкописни форми — „стигнахте" се чете „cmuгнaxmе". Изключваме ги. */
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;font-feature-settings:"locl" 0}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2.5px solid var(--door);outline-offset:2px;border-radius:3px}

  /* твърда височина, а не min-height — иначе цялата страница се разтяга
     и лентата „докъде си" плюс бутоните падат под екрана */
  .phone{max-width:440px;margin:0 auto;height:100dvh;background:var(--surface);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--line),0 18px 50px -20px var(--shadow);overflow:hidden}
  @media (min-width:520px){ body{padding:24px 16px} .phone{height:calc(100dvh - 48px);border-radius:14px} }

  .topbar{flex:none;padding:9px 14px 8px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .route-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
  @media (max-width:430px){ .route-name .wide{display:none} }
  .tools{display:flex;gap:7px}
  .iconbtn{border:none;border-radius:999px;padding:7px 13px;background:var(--surface-2);color:var(--ink-soft);font:600 13px var(--sans)}
  .iconbtn.on{background:var(--act);color:var(--on-act)}
  .rail{display:flex;gap:2px;align-items:flex-end;height:13px}
  .seg{flex:1;height:4px;background:var(--surface-2);border-radius:1px;border:none;padding:0;transition:height .18s ease,background .18s ease}
  .seg.done{background:var(--ink-faint)}
  .seg.now{background:var(--act);height:9px}
  .seg.turn.done{background:var(--act);opacity:.45}

  /* ---- лентата с картата ---- */
  .mapstrip{flex:none;background:var(--map-ground);border-bottom:1px solid var(--line);cursor:pointer;position:relative;line-height:0}
  .mapstrip svg{display:block;width:100%;height:auto;max-height:32vh;margin:0 auto}
  .mapstrip.mini{padding:9px 12px;display:flex;align-items:center;gap:8px;line-height:normal}
  .mapstrip.mini #stripmap{display:none}
  .maptools{position:absolute;top:8px;right:8px;display:flex;gap:6px;line-height:normal;z-index:2}
  .mapstrip.mini .maptools{position:static;order:2;margin-left:auto}
  .mapbtn{border:none;border-radius:999px;padding:6px 11px;background:var(--surface);color:var(--ink-soft);font:600 12.5px var(--sans);box-shadow:0 1px 4px var(--shadow)}
  .mapstrip .hint{display:none;position:absolute;left:9px;bottom:6px;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);line-height:1;background:var(--map-ground);padding:2px 5px;border-radius:3px;opacity:.9}

  /* ---- самата карта (улици и сгради от OpenStreetMap) ---- */
  .mp-bg{fill:var(--map-ground)}
  .mp-bld{fill:var(--map-bld);stroke:var(--map-bld-line);stroke-width:1.2}
  .mp-case{fill:none;stroke:var(--map-road-line);stroke-width:9.5;stroke-linecap:round;stroke-linejoin:round}
  .mp-road{fill:none;stroke:var(--map-road);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
  .mp-trk{fill:none;stroke:var(--map-road-line);stroke-width:3.5;stroke-dasharray:9 7;stroke-linecap:round}
  /* маршрутът трябва да си личи над улиците, не да се слива с тях */
  .rt-halo{fill:none;stroke:var(--map-ground);stroke-width:11;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
  .rt{fill:none;stroke:var(--brand);stroke-width:5.5;stroke-linejoin:round;stroke-linecap:round}
  .rt-done{fill:none;stroke:var(--door);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
  .rt-lead{stroke:var(--live);stroke-width:2.5;stroke-dasharray:7 5;stroke-linecap:round}
  .mp-stop{fill:var(--surface);stroke:var(--ink-faint);stroke-width:2}
  .mp-stop.done{fill:var(--ink-faint);stroke:var(--surface)}
  .mp-stop.now{fill:var(--door);stroke:#fff;stroke-width:2.5}
  .mp-num{font-family:var(--sans);font-size:20px;font-weight:700;fill:var(--door);text-anchor:middle;stroke:var(--map-ground);stroke-width:4;paint-order:stroke fill}
  .mp-acc{fill:var(--live);opacity:.16}
  .mp-me{fill:var(--live);stroke:#fff;stroke-width:3}
  .mp-cone{fill:var(--live);opacity:.32}
  .num.going{color:var(--act);font-weight:600}
  .mp-attr{font-family:var(--sans);font-size:13px;fill:var(--ink-faint);opacity:.75}

  /* ---- живата лента „докъде си" ---- */
  .live{position:absolute;left:8px;bottom:8px;z-index:2;max-width:calc(100% - 16px);display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border:none;border-radius:999px;background:var(--surface);box-shadow:0 2px 8px var(--shadow);font:500 14px var(--sans);line-height:1.25;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap}
  .live > span:nth-child(2){overflow:hidden;text-overflow:ellipsis}
  .mapstrip.mini .live{position:static;box-shadow:none;background:var(--surface-2);order:1}
  .live .pip{width:10px;height:10px;border-radius:50%;background:var(--live);flex:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--live) 25%, transparent)}
  .live.searching .pip{animation:pulse 1.5s ease-in-out infinite}
  .live.dead{color:var(--ink-faint)}
  .live.dead .pip{background:var(--ink-faint);box-shadow:none}
  .live.near{color:var(--door)}
  .live b{color:var(--ink);font-weight:600}
  .live .far{color:var(--ink-faint);font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;flex:none}
  .live.dead b{color:var(--act)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.live.searching .pip{animation:none}}

  /* ---- съобщението при пристигане ---- */
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--act);color:var(--on-act);padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:40;box-shadow:0 8px 24px -8px var(--shadow);animation:pop 2.8s ease both;pointer-events:none;white-space:nowrap}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px)}10%,80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .card{padding:14px 16px 28px;display:flex;flex-direction:column;gap:16px}
  .titlerow{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .titlerow h1{flex:1}
  .playbtn{flex:none;display:inline-flex;align-items:center;gap:7px;border:none;border-radius:999px;padding:9px 16px 9px 12px;background:var(--act);color:var(--on-act);font:600 14px var(--sans);font-variant-numeric:tabular-nums}
  .playbtn svg{display:block}
  .playbtn.on{background:var(--surface-2);color:var(--act);box-shadow:inset 0 0 0 2px var(--act)}
  .anim{animation:slide .26s cubic-bezier(.22,.61,.36,1) both}
  .anim.back{animation-name:slideback}
  @keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  @keyframes slideback{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.anim,.anim.back{animation:none}.seg{transition:none}}

  .head{display:flex;flex-direction:column;gap:8px}
  .kicker{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .num{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .badge{font-family:var(--mono);font-size:10px;letter-spacing:.13em;padding:3px 8px;border-radius:3px;border:1px solid var(--line);color:var(--ink-soft);text-transform:uppercase}
  .badge.turn{background:var(--act);border-color:var(--act);color:var(--on-act)}
  .badge.view{border-color:var(--ochre);color:var(--ochre)}
  .badge.visit{background:var(--surface-2);border-color:var(--surface-2);color:var(--ink)}
  h1.title{font-family:var(--serif);font-size:26px;line-height:1.18;font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}

  .shot{display:flex;flex-direction:column;gap:8px}
  .shot img.main{width:100%;border-radius:7px;display:block;background:var(--surface-2);cursor:zoom-in}
  .thumbs{display:flex;gap:7px;flex-wrap:wrap}
  .thumbs img{width:74px;height:74px;object-fit:cover;border-radius:5px;display:block;background:var(--surface-2);cursor:zoom-in;border:1px solid var(--line)}

  .block{display:flex;flex-direction:column;gap:5px}
  .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint)}
  .block p{margin:0}
  .go{border-left:4px solid var(--act);padding:3px 0 3px 14px}
  .go p{font-weight:600;font-size:19px;line-height:1.42;color:var(--ink)}
  /* Табела „завой" (Б): стрелка + посока, горе на спирката. Цветът е цветът на действието. */
  .turnsign{display:flex;align-items:center;gap:13px;background:var(--act);color:var(--on-act);border-radius:11px;padding:12px 16px 12px 13px}
  .turnsign svg{flex:none;width:40px;height:40px}
  .turnsign small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;opacity:.85}
  .turnsign b{display:block;font-size:21px;font-weight:700;line-height:1.2}
  /* Стрелка на картата (В): сочи накъдето върви пътят от завоя */
  .ml-turn{width:26px;height:26px;border-radius:50%;background:var(--act);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;pointer-events:none}
  .ml-turn svg{width:16px;height:16px;display:block}
  /* „Следва" — в дъното на всяка спирка: коя е следващата и как се познава. Не се натиска нищо, за да се види. */
  .nextcard{margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:13px 14px 15px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
  .nextcard > .label{color:var(--act)}
  .nc-row{display:flex;gap:12px;align-items:center}
  .nc-row img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2);cursor:zoom-in}
  .nc-row b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.25}
  .nc-row small{display:block;margin-top:3px;font-size:13.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .note{background:var(--surface-2);border-radius:6px;padding:13px 14px;font-size:16px}
  .note .label{margin-bottom:4px;display:block}
  .warn{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ochre);line-height:1.45}
  .warn svg{flex:none;margin-top:2px}

  .actions{flex:none;display:flex;gap:9px;padding:11px 14px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
  .btn{border-radius:8px;border:1px solid var(--line);background:transparent;padding:15px 16px;font-size:16px;font-weight:600;transition:background .15s ease}
  .btn:active{background:var(--surface-2)}
  .btn.wide{flex:1}
  .btn.primary{background:var(--act);border-color:var(--act);color:var(--on-act)}
  .btn.primary:active{filter:brightness(.92)}
  .btn.ghost{color:var(--ink-soft);padding-left:18px;padding-right:18px}

  /* ---- корицата ---- */
  .cover{display:flex;flex-direction:column}
  /* ---- началният екран: селото, картата с разходките, разходките ---- */
  .home{display:flex;flex-direction:column}
  .home .hero img{aspect-ratio:16/9}
  .homebody{padding:0 16px 26px;margin-top:-30px;position:relative;z-index:3;display:flex;flex-direction:column;gap:18px}
  .home .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--door)}
  .home h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;margin:4px 0 0;letter-spacing:-.015em}
  .home .lede{margin:0;color:var(--ink-soft);font-size:16.5px}
  .homemap{border-radius:10px;overflow:hidden;border:1px solid var(--line);position:relative}
  .homemap .mlmap{aspect-ratio:4/3;max-height:none}
  .homemap:empty{display:none}
  .sect{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin:6px 0 -6px}
  .walkcard{display:flex;gap:0;text-align:left;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;color:inherit}
  .walkcard:not([disabled]):active{background:var(--surface-2)}
  .walkcard[disabled]{cursor:default}
  .walkcard .bar{width:6px;flex:none;background:var(--lvl,var(--ink-faint))}
  .walkcard[disabled] .bar{background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 10px)}
  .walkcard .wc{flex:1;padding:13px 14px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
  .wc .wn{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:flex;gap:8px;align-items:center}
  .wc .lvl{display:inline-flex;align-items:center;gap:5px;color:var(--ink-soft)}
  .wc .lvl i{width:9px;height:9px;border-radius:50%;background:var(--lvl)}
  .wc b{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.2}
  .walkcard[disabled] b{color:var(--ink-soft)}
  .wc .ws{font-size:14px;color:var(--ink-soft);line-height:1.4}
  .wc .wf{font-size:13.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .wc .resume{margin-top:3px;font-weight:600;font-size:14.5px;color:var(--act)}
  /* ---- местата: списъкът на началния екран и страницата на всяко място ---- */
  .placerow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 0;background:none;border:none;border-bottom:1px solid var(--line);color:inherit}
  .placerow:last-of-type{border-bottom:none}
  .placerow:active{background:var(--surface-2)}
  .placerow .pth{width:58px;height:58px;border-radius:7px;flex:none;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;color:var(--ink-faint)}
  .placerow .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .placerow b{font-family:var(--serif);font-weight:400;font-size:17.5px;line-height:1.25}
  .placerow small{font-size:13.5px;color:var(--ink-faint);line-height:1.35}
  .placerow .chev{color:var(--ink-faint);flex:none;font-size:18px}
  .placelist{display:flex;flex-direction:column}
  .place .body{display:flex;flex-direction:column}
  .place .ph img.main{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2);cursor:zoom-in}
  .place .ph .thumbs{padding:8px 16px 0}
  .place .pbody{padding:16px 16px 26px;display:flex;flex-direction:column;gap:14px}
  .place h1{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;margin:0;letter-spacing:-.01em}
  .place .ptxt p{margin:0 0 10px}
  .place .visit{display:flex;gap:10px;align-items:baseline;background:var(--surface-2);border-radius:7px;padding:11px 13px;font-size:15.5px}
  .place .visit .label{flex:none}
  .place .pmap{border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .place .pmap .mlmap{aspect-ratio:16/10;max-height:none}
  .place .pmap:empty{display:none}
  .place .pmeta{margin:0;font-size:14px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .place .draft{margin:0;font-size:14.5px;color:var(--ink-faint);font-style:italic}
  .ml-pin{width:20px;height:20px;border-radius:50%;background:var(--act);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
  .home .credit{margin:4px 0 0;font-size:13px;color:var(--ink-faint);line-height:1.45}
  .home .gpsnote{margin:0}
  .ml-wnum{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--sans);color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .hero{position:relative;background:var(--surface-2)}
  .hero img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 52%,var(--surface) 93%,var(--surface) 100%)}
  .crest{position:absolute;top:14px;left:16px;z-index:2;display:flex;align-items:center;gap:9px}
  .crest img{width:40px;height:auto;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
  .crest span{font-family:var(--mono);font-size:9.5px;line-height:1.25;letter-spacing:.11em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);max-width:13ch}
  .coverbody{padding:0 20px 26px;margin-top:-34px;position:relative;z-index:3;display:flex;flex-direction:column;gap:20px}

  .welcome{border-left:2px solid var(--brand);padding:2px 0 2px 15px}

  .welcome p{margin:0;font-family:var(--serif);font-size:17.5px;line-height:1.5;color:var(--ink)}

  .fact small{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

  .cover li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;color:var(--ink-soft);line-height:1.45}

  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  var ICON={
    warn:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4.5 21 20H3z"/><path d="M12 10.5v4"/><path d="M12 17.2v.1"/></svg>',

  function haversine(a,b,c,d){var R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;
    var h=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
    return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
  function distTo(g){ return me?haversine(me.lat,me.lon,g.lat,g.lon):null }

  // Страница на забележителност — отваря се над всичко (от началния екран, после и сама при пристигане).

  /* ---------- аудио ----------
     AUDIO[номер на спирка от 0] = файл. Празно, докато няма запис —
     тогава бутон изобщо не се показва.                                  */
  var AUDIO={0:"audio/razdumka.m4a"};   // ПРОБЕН запис, 28.09.2026 — ще се смени
  var PLAY='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  var PAUSE='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>';
  function audioBtn(i){ return AUDIO[i]?'<button class="playbtn" type="button" id="playbtn">'+PLAY+'<span>Слушайте</span></button>':''; }

  /* Записът се тегли предварително като „blob“. Така:
     (1) пуска се мигновено от „Тръгвам“ — iPhone разрешава звук само в самото докосване;
     (2) превъртането работи и офлайн — iPhone иска от сървъра „части“ от аудиото,
         а кешът на service worker-а не ги дава; от blob не му трябват.             */
  var AUD=null, BLOB={};
  function audEl(){
    if(AUD) return AUD;
    AUD=new Audio(); AUD.preload="auto";
    ["play","pause","ended","timeupdate","loadedmetadata"].forEach(function(ev){ AUD.addEventListener(ev,paintPlay) });
    return AUD;
  }
  Object.keys(AUDIO).forEach(function(k){
    try{ fetch(AUDIO[k]).then(function(r){ return r.ok?r.blob():null }).then(function(b){ if(b) BLOB[k]=URL.createObjectURL(b) }).catch(function(){}); }catch(e){}
  });
  function mmss(s){ s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+":"+("0"+s%60).slice(-2) }
  function playFor(i){
    if(!AUDIO[i]) return;
    var a=audEl(), want=BLOB[i]||AUDIO[i];
    if(a.getAttribute("data-i")!==String(i)){ a.src=want; a.setAttribute("data-i",String(i)); }
    var p=a.play(); if(p&&p.catch) p.catch(function(){ paintPlay() });
  }
  function stopAudio(){ if(AUD&&!AUD.paused) AUD.pause() }
  function paintPlay(){
    var b=document.getElementById("playbtn"); if(!b) return;
    var mine=AUD&&AUD.getAttribute("data-i")===String(view);
    var on=mine&&!AUD.paused&&!AUD.ended;
    var dur=(AUD&&mine&&isFinite(AUD.duration))?AUD.duration:0;
    b.className="playbtn"+(on?" on":"");
    b.innerHTML=(on?PAUSE:PLAY)+'<span>'+(on?mmss(AUD.currentTime)+" / "+mmss(dur)
                 :(mine&&AUD.currentTime>1&&!AUD.ended?"Продължете · "+mmss(AUD.currentTime):"Слушайте"+(dur?" · "+mmss(dur):"")))+'</span>';
  }

  function stopHTML(i){
    var s=TEXT[i], g=GEO[i], p=i>0?TEXT[i-1]:null, pg=i>0?GEO[i-1]:null;
    // „На път към“: човекът е тръгнал от предишната, но още не е стигнал (GPS-ът ще каже).
    // Показва се всичко за спирката — снимката, за да я познае, — а отгоре как се стига.
    var going=!arrived&&!!p;
    var h='<div class="card anim'+(dir<0?" back":"")+'">';
    if(g.pics.length){
      h+='<div class="shot"><img class="main" src="'+PIC[g.pics[0]]+'" alt="'+esc(s.title)+'">';
      if(g.pics.length>1){
        h+='<div class="thumbs">';
        for(var k=1;k<g.pics.length;k++){ h+='<img src="'+PIC[g.pics[k]]+'" alt="'+esc(s.title)+'">' }
        h+='</div>';
      }
      h+='</div>';
    }
    h+='<div class="head"><div class="kicker">'+
       (going ? '<span class="num going">На път към спирка '+(i+1)+' от '+TEXT.length+'</span>'
              : '<span class="num">Спирка '+(i+1)+' от '+TEXT.length+'</span>')+
       (s.t!=="stop"?'<span class="badge '+s.t+'">'+LABELS[s.t]+'</span>':'')+
       (going?'':'<span class="num">'+g.m+' м</span>')+
       '</div><div class="titlerow"><h1 class="title">'+esc(s.title)+'</h1>'+audioBtn(i)+'</div></div>';
    // Всеки текст стои САМО на своята спирка. „Накъде“ в текстовете на сдружението казва
    // какво се прави тук и после („слезте и пийте… върнете се на пътя“) — не е пътят до
    // следващата. Затова на път към спирката най-отгоре е нейното „Какво търсите“:
    // то казва как да я познаете.
    var look='<div class="block'+(going?" go":"")+'"><span class="label">Какво търсите</span><p>'+esc(s.look)+'</p></div>';
    var goB='<div class="block'+(going?"":" go")+'"><span class="label">Накъде</span><p>'+esc(s.go)+'</p></div>';
    h+=turnSignHTML(i);
    h+= going ? look+goB : goB+look;
    if(s.note) h+='<div class="note"><span class="label">Между другото</span><p>'+esc(s.note)+'</p></div>';
    if(s.warn) h+='<div class="warn">'+ICON.warn+'<span>'+esc(s.warn)+'</span></div>';
    if(going&&pg&&pg.walk) h+='<p class="walknote">От предишната — около '+pg.walk+' мин вървене.</p>';
    if(i<TEXT.length-1) h+=nextCardHTML(i);          // „Следва“ — на всяка спирка, стигнали или на път
    h+='</div>';
    return h;
  }

  // Табела „завой": накъде се тръгва ОТ тази спирка (поле ПОСОКА в текстовете).
  // Стрелката се решава от думата: „наляво" → ↰, „надясно" → ↱, иначе ↑.
  var ARROW={
    right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20v-7a4 4 0 0 1 4-4h9"/><path d="M15 5l4 4-4 4"/></svg>',
    left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20v-7a4 4 0 0 0-4-4H5"/><path d="M9 5L5 9l4 4"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></svg>'
  };
  function dirKind(d){ d=(d||"").toLowerCase(); return d.indexOf("наляво")>=0?"left":(d.indexOf("надясно")>=0?"right":"up") }
  function turnSignHTML(i){
    var d=TEXT[i].dir; if(!d) return "";
    return '<div class="turnsign">'+ARROW[dirKind(d)]+'<span><small>Оттук</small><b>'+esc(d.charAt(0).toUpperCase()+d.slice(1))+'</b></span></div>';
  }

  // „Следва“: следващата спирка в малко прозорче — снимка, име, колко е, как се познава.
  function nextCardHTML(i){
    var s=TEXT[i], g=GEO[i], n=TEXT[i+1], ng=GEO[i+1];

    h+='<div><b>'+(i+2)+' · '+esc(n.title)+'</b><small id="ncfar">'+far+(g.walk?' · около '+g.walk+' мин':'')+'</small></div></div>';
    h+='<div class="block"><span class="label">Какво търсите там</span><p>'+esc(n.look)+'</p></div>';
    return h+'</div>';
  }

  function finHTML(){
    return '<div class="fin anim">'+
      '<h1>'+esc(COPY.finTitle)+'</h1>'+
      '<p>'+esc(COPY.finText)+'</p>'+
      '<div class="offer">'+

      '</div>'+
      '<div class="colophon"><img src="'+LOGO+'" alt=""><span>'+esc(COPY.l1||"")+

  function btn(id,txt,cls){return '<button class="btn '+(cls||"")+'" type="button" id="'+id+'">'+txt+'</button>'}

  function render(){
    actions.hidden=home;
    if(home){ scroll.innerHTML=homeHTML(); actions.innerHTML=""; }
    else if(view<0){ scroll.innerHTML=coverHTML(); actions.innerHTML=btn("prev","Назад","ghost")+btn("next","Тръгвам","primary wide"); }
    else if(view>=TEXT.length-1&&arrived){ scroll.innerHTML=stopHTML(view)+finHTML(); actions.innerHTML=btn("prev","Назад","ghost")+btn("restart","Отначало","wide"); }
    else if(view>=TEXT.length-1){ scroll.innerHTML=stopHTML(view); actions.innerHTML=btn("prev","Назад","ghost")+btn("next","Стигнах края","primary wide"); }
    else { scroll.innerHTML=stopHTML(view); actions.innerHTML=btn("prev","Назад","ghost")+btn("next","Към спирка "+(view+2),"primary wide"); }
    if(home){ topbar.hidden=true } else drawRail();
    scroll.scrollTop=0;
    if(view<0||home){ document.getElementById("strip").hidden=true } else { paintStrip() }
    if(home) mlHome(document.getElementById("homemap")); else mlHomeOff();
    if(AUD&&AUD.getAttribute("data-i")!==String(view)) stopAudio();
    paintPlay();
    if(document.getElementById("sheetmap")) redrawSheet(); else paintMe();
    try{localStorage.setItem(KEY,String(view)); localStorage.setItem(AKEY,arrived?"1":"0"); localStorage.setItem(HKEY,home?"1":"0")}catch(e){}
  }
  // скок към спирка (списък, лента горе): смята се, че сте при нея
  function go(n,d){dir=d||(n>view?1:-1);view=Math.max(-1,Math.min(n,TEXT.length-1));arrived=true;render()}
  // „Към спирка N“ / „Стигнах края“ / „Тръгвам“
  function nextAction(){
    if(view<0){
      if(!trackOn&&!denied) startTracking(true);
      startCompass();
      dir=1; view=0; arrived=true; render(); if(AUDIO[0]) playFor(0);
      return;
    }
    // Едно натискане: тръгвате към следващата. Стигането го казва GPS-ът сам;
    // без GPS страницата пак има всичко — само горе пише „На път към“.
    if(view<TEXT.length-1){ dir=1; view++; arrived=false; render(); return; }
    if(!arrived) arriveAt(view,false);                        // последната спирка → финалът
  }
  // „Назад“ — стъпка назад по същите състояния
  function prevAction(){
    if(home) return;
    if(view<0){ dir=-1; home=true; render(); return; }
    dir=-1;
    if(view>0){ view--; arrived=true; }
    else { view=-1; arrived=true; }
    render();
  }
  function arriveAt(n,auto){
    lastAdv=Date.now(); dir=1; view=n; arrived=true; render();
    if(auto){ buzz(); toast(arriveMsg(n)); }
    if(AUDIO[n]) playFor(n);
  }

  /* ---------- карта ----------
     Улиците и сградите са от OpenStreetMap (ODbL), взети през Overpass и
     превърнати във вектор — затова картата тежи 3 KB, а не мегабайти,
     остава остра при всякакво увеличение и се пребоядисва в тъмната тема.
     Проекцията е Web Mercator, същата като на MAPGEO — иначе следата
     нямаше да лежи върху улиците.                                        */
  var POW=Math.pow(2,MAPV.z);
  function lon2px(lon){ return ((lon+180)/360)*256*POW }
  function lat2px(lat){ var s=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*POW }
  function mx(lon){ return (lon2px(lon)-MAPV.x0)*MAPV.s }
  function my(lat){ return (lat2px(lat)-MAPV.y0)*MAPV.s }
  var MPP=156543.03392*Math.cos(43.022*Math.PI/180)/POW;   // метри на пиксел
  var PPM=MAPV.s/MPP;                                      // единици на метър

  // Кутията, която се вижда. Приближено = ~340 м около теб (или около спирката),
  // но никога извън нарисуваното — иначе се показва празно поле.
  function mapBox(zoomed){
    if(!zoomed) return {x:0,y:0,w:MAPV.w,h:MAPV.h};
    var c = me ? {lon:me.lon,lat:me.lat} : (view>=0?GEO[view]:GEO[0]);
    var hw=Math.min(170*PPM, MAPV.w/2), hh=hw*(MAPV.h/MAPV.w)*1.9;
    if(hh>MAPV.h/2) hh=MAPV.h/2;
    var cx=Math.max(hw,Math.min(MAPV.w-hw, mx(c.lon)));
    var cy=Math.max(hh,Math.min(MAPV.h-hh, my(c.lat)));
    return {x:cx-hw,y:cy-hh,w:2*hw,h:2*hh};
  }

  function mapSVG(p,zoomed){
    var box=mapBox(zoomed);
    var k=MAPV.w/box.w;                       // колко пъти е приближено
    var W=function(base){ return (base/k).toFixed(2) };   // дебелини, за да не надебеляват
    var M=260;                                // запас на фона, за да няма бели полета
    var doneM=(view>=0&&view<GEO.length)?GEO[view].m:0;
    var all=[], done=[];
    for(var i=0;i<TRACK.length;i++){
      var pt=mx(TRACK[i][1]).toFixed(1)+","+my(TRACK[i][0]).toFixed(1);
      all.push(pt);
      if(CUM[i]<=doneM) done.push(pt);
    }
    var s='<svg viewBox="'+box.x.toFixed(1)+' '+box.y.toFixed(1)+' '+box.w.toFixed(1)+' '+box.h.toFixed(1)+
          '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
    s+='<rect x="'+(-M)+'" y="'+(-M)+'" width="'+(MAPV.w+2*M)+'" height="'+(MAPV.h+2*M)+'" class="mp-bg"/>';
    MAPGEO.builds.forEach(function(d){ s+='<polygon points="'+d+'" class="mp-bld" style="stroke-width:'+W(1.2)+'"/>' });
    MAPGEO.roads.forEach(function(d){ s+='<polyline points="'+d+'" class="mp-case" style="stroke-width:'+W(9.5)+'"/>' });
    MAPGEO.roads.forEach(function(d){ s+='<polyline points="'+d+'" class="mp-road" style="stroke-width:'+W(6.5)+'"/>' });
    MAPGEO.tracks.forEach(function(d){ s+='<polyline points="'+d+'" class="mp-trk" style="stroke-width:'+W(3.5)+';stroke-dasharray:'+W(9)+' '+W(7)+'"/>' });

    s+='<polyline points="'+all.join(" ")+'" class="rt-halo" style="stroke-width:'+W(11)+'"/>';
    s+='<polyline points="'+all.join(" ")+'" class="rt" style="stroke-width:'+W(5.5)+'"/>';
    if(done.length>1) s+='<polyline points="'+done.join(" ")+'" class="rt-done" style="stroke-width:'+W(6)+'"/>';
    s+='<line id="'+p+'lead" x1="0" y1="0" x2="0" y2="0" class="rt-lead" style="display:none;stroke-width:'+W(2.5)+';stroke-dasharray:'+W(7)+' '+W(5)+'"/>';

    GEO.forEach(function(g,i){
      var on=(i===view);
      s+='<circle cx="'+mx(g.lon).toFixed(1)+'" cy="'+my(g.lat).toFixed(1)+'" r="'+W(on?9:5.5)+
         '" class="mp-stop'+(on?" now":(i<view?" done":""))+'" style="stroke-width:'+W(on?2.5:2)+'"/>';
      if(on) s+='<text x="'+mx(g.lon).toFixed(1)+'" y="'+(my(g.lat)-15/k).toFixed(1)+
              '" class="mp-num" style="font-size:'+W(20)+'px;stroke-width:'+W(4)+'">'+(i+1)+'</text>';
    });
    s+='<g id="'+p+'me" style="display:none">'+
       '<circle id="'+p+'acc" cx="0" cy="0" r="0" class="mp-acc"/>'+
       // конус „накъде гледам“ — сочи на север (нагоре), завърта се по компаса
       '<path id="'+p+'cone" d="M0,0 L'+(-15/k).toFixed(1)+','+(-36/k).toFixed(1)+' A'+(39/k).toFixed(1)+','+(39/k).toFixed(1)+' 0 0 1 '+(15/k).toFixed(1)+','+(-36/k).toFixed(1)+' Z" class="mp-cone" style="display:none"/>'+
       '<circle id="'+p+'dot" cx="0" cy="0" r="'+W(8)+'" class="mp-me" style="stroke-width:'+W(3)+'"/></g>';
    s+='<text x="'+(box.x+box.w-4/k)+'" y="'+(box.y+box.h-4/k)+'" text-anchor="end" class="mp-attr" style="font-size:'+W(13)+'px">© OpenStreetMap contributors</text>';
    s+='</svg>';
    return s;
  }

  function paintMe(){
    ["s","b"].forEach(function(p){
      var grp=document.getElementById(p+"me"), d=document.getElementById(p+"dot"),
          ac=document.getElementById(p+"acc"), ld=document.getElementById(p+"lead");
      if(!grp||!d) return;
      if(!me){ grp.style.display="none"; if(ld) ld.style.display="none"; return }
      var x=mx(me.lon), y=my(me.lat);
      d.setAttribute("cx",x.toFixed(1)); d.setAttribute("cy",y.toFixed(1));
      if(ac){
        ac.setAttribute("cx",x.toFixed(1)); ac.setAttribute("cy",y.toFixed(1));
        ac.setAttribute("r",Math.max(9,Math.min(180,me.acc*PPM)).toFixed(1));
      }
      grp.style.display="block";
      paintCone(p,x,y);
      if(ld){
        var nx=(view<0)?null:(!arrived?GEO[view]:(view<GEO.length-1?GEO[view+1]:null));
        if(nx){
          ld.setAttribute("x1",x.toFixed(1)); ld.setAttribute("y1",y.toFixed(1));
          ld.setAttribute("x2",mx(nx.lon).toFixed(1)); ld.setAttribute("y2",my(nx.lat).toFixed(1));
          ld.style.display="block";
        } else ld.style.display="none";
      }
    });
    mlMe(ML.strip); mlMe(ML.sheet); mlMe(ML.place);
    if(me&&ML.mode==="me") mlCamera(ML.sheet,true);
    paintLive();
    // Съзнателно НЕ показваме „най-близката спирка“ — маршрутът се връща покрай себе си
    // (спирка 2 и спирка 12 са на пет метра) и такова число само обърква.
    var msg=document.getElementById("gpsmsg");
    if(msg&&me&&view>=0){
      var dHere=distTo(GEO[view]), s;
      if(dHere<=ARRIVE) s="Сега сте на <b>спирка "+(view+1)+"</b>.";
      else if(view<GEO.length-1) s="До <b>спирка "+(view+2)+"</b> остават "+fmtDist(distTo(GEO[view+1]))+".";
      else s="До <b>спирка "+(view+1)+"</b> остават "+fmtDist(dHere)+".";
      msg.innerHTML=s+" Точност около "+me.acc+" м.";
    }
    var prg=document.getElementById("gpsprog");
    if(prg&&view>=0) prg.innerHTML="Спирка <b>"+(view+1)+"</b> от "+GEO.length+
      " · изминати <b>"+GEO[view].m+" м</b>";
  }

  /* Компас. iPhone дава посоката готова (webkitCompassHeading) и иска разрешение —
     затова се пита при „Тръгвам“. Android дава ъгъл спрямо север (absolute).
     Компасът на телефона греши с 10–20°, особено до метал или кола.            */
  var heading=null, compassOn=false, coneRaf=0, compassAt=0, compassAsking=false;
  function startCompass(){
    if(compassOn) return;
    var on=function(e){
      var h=null;
      if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading;
      else if(e.absolute&&typeof e.alpha==="number") h=360-e.alpha;
      if(h===null) return;
      var ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
      heading=(h+ang+360)%360; compassAt=Date.now();
      var now=Date.now(); if(now-coneRaf<60) return; coneRaf=now;   // до ~16 пъти в секунда — стига за плавно, пести батерия
      ["s","b"].forEach(function(p){ if(me) paintCone(p,mx(me.lon),my(me.lat)) });
      mlCone(ML.strip); mlCone(ML.sheet);
    };
    try{
      if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"){
        if(compassAsking) return;                 // прозорчето „Разреши“ вече е отворено
        compassAsking=true;
        DeviceOrientationEvent.requestPermission().then(function(r){
          compassAsking=false;
          if(r==="granted"){ compassOn=true; window.addEventListener("deviceorientationabsolute",on); window.addEventListener("deviceorientation",on); }
        }).catch(function(){ compassAsking=false });
      } else if(window.DeviceOrientationEvent){
        compassOn=true;
        window.addEventListener("deviceorientationabsolute",on);
        window.addEventListener("deviceorientation",on);
      }
    }catch(e){}
  }
  document.addEventListener("click",function(){ if(view>=0) startCompass() },true);
  function paintCone(p,x,y){
    var c=document.getElementById(p+"cone"); if(!c) return;
    if(heading===null){ c.style.display="none"; return }
    c.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+") rotate("+heading.toFixed(0)+")");
    c.style.display="block";
  }

  /* ---------- истинската карта (етап 2) ----------
     MapLibre рисува от файлове в map\, които пристигат с приложението и се пазят
     за офлайн: selo.json (улици, пътеки, гори, ливади, хоризонтали, нашите следи)
     и dem\ (височините — от тях идва сянката на хълмовете). Никакви плочки отвън.
     Ако MapLibre не тръгне (стар телефон без WebGL, файлът не е дошъл) — остава
     старата SVG карта отгоре, нищо не се чупи. Правят се с ЗАПИСИ\pravi-kartata.js. */
  var BASE=location.href.replace(/[#?].*$/,"").replace(/[^\/]*$/,"");
  var ML={ok:false, data:null, strip:null, sheet:null, home:null, place:null, mode:"me"};   // mode: me = води след теб, all = цялата, free = човекът я мести

  function mlLoad(){
    try{
      var cv=document.createElement("canvas");
      if(!(cv.getContext("webgl2")||cv.getContext("webgl"))) return;
    }catch(e){ return }
    var css=document.createElement("link"); css.rel="stylesheet"; css.href="map/maplibre-gl.css"; document.head.appendChild(css);
    var js=new Promise(function(ok,no){
      var s=document.createElement("script"); s.src="map/maplibre-gl.js"; s.onload=ok; s.onerror=no; document.head.appendChild(s);
    });
    var dt=fetch("map/selo.json").then(function(r){ if(!r.ok) throw r.status; return r.json() });
    Promise.all([js,dt]).then(function(v){
      if(!window.maplibregl) return;
      ML.data=v[1]; ML.ok=true;
      if(home) mlHome(document.getElementById("homemap"));
      else if(view>=0) paintStrip();
      if(document.getElementById("sheetmap")) redrawSheet();
    }).catch(function(){});
  }

  function mlDark(){
    var c=getComputedStyle(document.documentElement).getPropertyValue("--map-ground").trim();
    var m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(c);
    return m ? (parseInt(m[1],16)+parseInt(m[2],16)+parseInt(m[3],16))<384 : false;
  }
  function mlStyle(){
    var cs=getComputedStyle(document.documentElement), v=function(n){ return cs.getPropertyValue(n).trim() };
    var dk=mlDark();
    var P=dk
      ? {res:"#1B1F1E",meadow:"#1C2320",scrub:"#1E2721",forest:"#1B2A21",water:"#1E3542",contour:"#8A7B5E",shade:"#000000",light:"#3B403D",walked:"#8C8472"}
      : {res:"#E4E2D8",meadow:"#E2E8CE",scrub:"#D3DEC2",forest:"#C2D4B3",water:"#BCD6E6",contour:"#A68A5E",shade:"#4F4636",light:"#FFFFFF",walked:"#9A8F78"};
    var K=function(k){ return ["==",["get","k"],k] };
    return {
      version:8,
      sources:{
        selo:{type:"geojson",data:ML.data},
        dem:{type:"raster-dem",tiles:[BASE+"map/dem/{z}/{x}/{y}.png"],encoding:"terrarium",tileSize:256,
             minzoom:14,maxzoom:14,bounds:[24.7852,43.0045,24.8291,43.0327]},
        route:{type:"geojson",data:{type:"FeatureCollection",features:[]}},
        stops:{type:"geojson",data:{type:"FeatureCollection",features:[]}},
        me:{type:"geojson",data:{type:"FeatureCollection",features:[]}},
        walks:{type:"geojson",data:{type:"FeatureCollection",features:[]}}
      },
      layers:[
        {id:"bg",type:"background",paint:{"background-color":v("--map-ground")}},
        {id:"res",type:"fill",source:"selo",filter:K("res"),paint:{"fill-color":P.res}},
        {id:"meadow",type:"fill",source:"selo",filter:K("meadow"),paint:{"fill-color":P.meadow}},
        {id:"scrub",type:"fill",source:"selo",filter:K("scrub"),paint:{"fill-color":P.scrub}},
        {id:"forest",type:"fill",source:"selo",filter:K("forest"),paint:{"fill-color":P.forest}},
        {id:"water",type:"fill",source:"selo",filter:K("water"),paint:{"fill-color":P.water}},
        {id:"shade",type:"hillshade",source:"dem",paint:{"hillshade-shadow-color":P.shade,"hillshade-highlight-color":P.light,
          "hillshade-accent-color":P.shade,"hillshade-exaggeration":dk?0.5:0.45}},
        {id:"contour",type:"line",source:"selo",filter:["all",K("contour"),["==",["get","i"],0]],
          paint:{"line-color":P.contour,"line-opacity":0.32,"line-width":["interpolate",["linear"],["zoom"],14,0.5,18,1]}},
        {id:"contour-i",type:"line",source:"selo",filter:["all",K("contour"),["==",["get","i"],1]],
          paint:{"line-color":P.contour,"line-opacity":0.55,"line-width":["interpolate",["linear"],["zoom"],14,0.9,18,1.8]}},
        {id:"bld",type:"fill",source:"selo",filter:K("bld"),paint:{"fill-color":v("--map-bld"),"fill-outline-color":v("--map-bld-line")}},
        {id:"stream",type:"line",source:"selo",filter:K("stream"),paint:{"line-color":P.water,"line-width":2}},
        // нашите записани следи — там, където OSM няма пътека, ние сме минали
        {id:"walked",type:"line",source:"selo",filter:K("walked"),layout:{"line-cap":"round","line-join":"round"},
          paint:{"line-color":P.walked,"line-opacity":0.8,"line-width":["interpolate",["linear"],["zoom"],14,1,18,2.2],"line-dasharray":[2,2]}},
        {id:"track",type:"line",source:"selo",filter:["any",K("track"),K("path")],layout:{"line-cap":"round"},
          paint:{"line-color":v("--map-road-line"),"line-width":["interpolate",["linear"],["zoom"],14,1,18,3],"line-dasharray":[2.5,2]}},
        {id:"road-case",type:"line",source:"selo",filter:K("road"),layout:{"line-cap":"round","line-join":"round"},
          paint:{"line-color":v("--map-road-line"),"line-width":["interpolate",["exponential",1.6],["zoom"],14,2.5,16,5.5,18,14,19,24]}},
        {id:"road",type:"line",source:"selo",filter:K("road"),layout:{"line-cap":"round","line-join":"round"},
          paint:{"line-color":v("--map-road"),"line-width":["interpolate",["exponential",1.6],["zoom"],14,1.3,16,3.8,18,10.5,19,19]}},
        {id:"poi",type:"circle",source:"selo",filter:K("poi"),
          paint:{"circle-radius":3.5,"circle-color":["match",["get","t"],"cheshma",v("--live"),"vodopad",v("--live"),v("--ink-faint")],
                 "circle-stroke-color":v("--map-ground"),"circle-stroke-width":1.5,"circle-opacity":0.85}},
        {id:"walks-halo",type:"line",source:"walks",layout:{"line-cap":"round","line-join":"round"},
          paint:{"line-color":v("--map-ground"),"line-opacity":0.9,"line-width":7}},
        {id:"walks",type:"line",source:"walks",layout:{"line-cap":"round","line-join":"round"},
          paint:{"line-color":["get","c"],"line-width":4,"line-opacity":["match",["get","soon"],1,0.75,1]}},
        // маршрутът: оранжев като логото, изминатото — в цвета на „тази спирка“
        {id:"rt-halo",type:"line",source:"route",filter:["==",["get","k"],"all"],layout:{"line-cap":"round","line-join":"round"},
          paint:{"line-color":v("--map-ground"),"line-opacity":0.9,"line-width":["interpolate",["linear"],["zoom"],14,5,18,12]}},
        {id:"rt",type:"line",source:"route",filter:["==",["get","k"],"all"],layout:{"line-cap":"round","line-join":"round"},
          paint:{"line-color":v("--brand"),"line-width":["interpolate",["linear"],["zoom"],14,2.5,18,6]}},
        {id:"rt-done",type:"line",source:"route",filter:["==",["get","k"],"done"],layout:{"line-cap":"round","line-join":"round"},
          paint:{"line-color":v("--door"),"line-width":["interpolate",["linear"],["zoom"],14,2.8,18,6.5]}},
        {id:"acc",type:"fill",source:"me",filter:["==",["get","k"],"acc"],paint:{"fill-color":v("--live"),"fill-opacity":0.16}},
        {id:"lead",type:"line",source:"me",filter:["==",["get","k"],"lead"],layout:{"line-cap":"round"},
          paint:{"line-color":v("--live"),"line-width":2.5,"line-dasharray":[2.5,2]}},
        {id:"stop",type:"circle",source:"stops",
          paint:{"circle-radius":["match",["get","s"],2,9,5.5],
                 "circle-color":["match",["get","s"],2,v("--door"),1,v("--ink-faint"),v("--surface")],
                 "circle-stroke-color":["match",["get","s"],2,"#ffffff",1,v("--surface"),v("--ink-faint")],
                 "circle-stroke-width":["match",["get","s"],2,2.5,2]}}
      ]
    };
  }

  function mlTrackBounds(){
    var b=[[180,90],[-180,-90]];
    TRACK.forEach(function(t){ b[0][0]=Math.min(b[0][0],t[1]); b[0][1]=Math.min(b[0][1],t[0]); b[1][0]=Math.max(b[1][0],t[1]); b[1][1]=Math.max(b[1][1],t[0]) });
    return b;
  }

  function mlMake(host,interactive,minZ){
    var el=document.createElement("div"); el.className="mlmap";
    host.appendChild(el);
    var map=new maplibregl.Map({
      container:el, style:mlStyle(), bounds:mlTrackBounds(), fitBoundsOptions:{padding:18},
      minZoom:minZ||14, maxZoom:19.5, maxBounds:[[24.7862,43.0065],[24.8281,43.0307]],
      interactive:interactive, attributionControl:false, dragRotate:false, pitchWithRotate:false,
      fadeDuration:0, renderWorldCopies:false
    });
    if(interactive&&map.touchZoomRotate) map.touchZoomRotate.disableRotation();
    var at=document.createElement("div"); at.className="ml-attr";
    at.textContent="© OpenStreetMap contributors"+(interactive?" · релеф: Terrain Tiles":"");
    el.appendChild(at);
    var o={map:map, el:el, ready:false, num:null, me:null};
    map.on("load",function(){ o.ready=true; mlState(o); mlMe(o); });
    map.on("error",function(e){ try{console.warn("карта:",e.error&&e.error.message)}catch(x){} });   // липсваща плочка от релефа не е беда
    return o;
  }

  // спирките и изминатата част — смени се при всяка нова спирка
  // Посоката на пътя от спирка i: най-близката точка на следата до спирката (търси се само
  // около нейния километраж — пътят минава покрай себе си), после ~10 и ~35 м напред.
  function trackAt(m){ for(var k=0;k<CUM.length;k++) if(CUM[k]>=m) return k; return CUM.length-1 }
  function stopOnTrack(g){
    var best=-1,bd=1e9;
    for(var k=0;k<TRACK.length;k++){ if(Math.abs(CUM[k]-g.m)>150) continue;
      var d=haversine(g.lat,g.lon,TRACK[k][0],TRACK[k][1]); if(d<bd){bd=d;best=k} }
    return best<0?trackAt(g.m):best;
  }
  function bearing(a,b){
    var y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180),
        x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);
    return (Math.atan2(y,x)*180/Math.PI+360)%360;
  }
  function turnArrows(o){
    (o.turns||[]).forEach(function(mk){ mk.remove() }); o.turns=[];
    GEO.forEach(function(g,i){
      if(!TEXT[i]||!TEXT[i].dir) return;
      if(o===ML.strip&&i!==view) return;          // в малката лента — само стрелката на текущата спирка
      var k0=CUM[stopOnTrack(g)], a=TRACK[trackAt(k0+10)], b=TRACK[trackAt(k0+35)];
      if(!a||!b||a===b) return;
      var inb=bearing(TRACK[trackAt(k0-35)],TRACK[trackAt(k0-5)]), out=bearing(a,b);
      var turn=((out-inb+540)%360)-180, kind=dirKind(TEXT[i].dir), brg=out;
      // Ако следата и текстът спорят (записът е минал по друг път — спирки 5 и 6 на 29.09),
      // стрелката следва текста: ±90° от посоката, от която идвате. Нов запис оправя това сам.
      if((kind==="right"&&turn<10)||(kind==="left"&&turn>-10)) brg=(inb+(kind==="right"?90:-90)+360)%360;
      var el=document.createElement("div"); el.className="ml-turn"; el.innerHTML=ARROW.up.replace('stroke="currentColor"','stroke="#fff"');
      o.turns.push(new maplibregl.Marker({element:el,rotationAlignment:"map"}).setLngLat([a[1],a[0]]).setRotation(brg).addTo(o.map));
    });
  }
  function mlState(o){
    if(!o||!o.ready||o.home) return;
    if(!o.turns||o===ML.strip) turnArrows(o);
    var doneM=(view>=0&&view<GEO.length)?GEO[view].m:0, all=[], done=[];
    for(var i=0;i<TRACK.length;i++){ all.push([TRACK[i][1],TRACK[i][0]]); if(CUM[i]<=doneM) done.push([TRACK[i][1],TRACK[i][0]]) }
    var rf=[{type:"Feature",properties:{k:"all"},geometry:{type:"LineString",coordinates:all}}];
    if(done.length>1) rf.push({type:"Feature",properties:{k:"done"},geometry:{type:"LineString",coordinates:done}});
    o.map.getSource("route").setData({type:"FeatureCollection",features:rf});
    var sf=GEO.map(function(g,i){ return {type:"Feature",properties:{s:i===view?2:(i<view?1:0)},geometry:{type:"Point",coordinates:[g.lon,g.lat]}} });
    sf.sort(function(a,b){ return a.properties.s===2?1:b.properties.s===2?-1:0 });   // текущата отгоре
    o.map.getSource("stops").setData({type:"FeatureCollection",features:sf});
    if(o.num){ o.num.remove(); o.num=null }
    if(view>=0&&view<GEO.length){
      var n=document.createElement("div"); n.className="ml-num"; n.textContent=String(view+1);
      o.num=new maplibregl.Marker({element:n,anchor:"bottom",offset:[0,-11]}).setLngLat([GEO[view].lon,GEO[view].lat]).addTo(o.map);
    }
  }

  // синята точка, кръгът на точността, пунктирът до следващата спирка
  function mlMe(o){
    if(!o||!o.ready) return;
    var f=[];
    if(me){
      var ring=[], r=Math.max(3,Math.min(250,me.acc)), k=Math.cos(me.lat*Math.PI/180);
      for(var a=0;a<=36;a++){ var t=a/36*2*Math.PI; ring.push([me.lon+r*Math.sin(t)/(111320*k), me.lat+r*Math.cos(t)/110540]) }
      f.push({type:"Feature",properties:{k:"acc"},geometry:{type:"Polygon",coordinates:[ring]}});
      var nx=(view<0)?null:(!arrived?GEO[view]:(view<GEO.length-1?GEO[view+1]:null));
      if(nx) f.push({type:"Feature",properties:{k:"lead"},geometry:{type:"LineString",coordinates:[[me.lon,me.lat],[nx.lon,nx.lat]]}});
      if(!o.me){
        var el=document.createElement("div"); el.className="ml-me";
        el.innerHTML='<svg class="cone" viewBox="-40 -40 80 80"><path d="M0,0 L-15,-36 A39,39 0 0 1 15,-36 Z" fill="var(--live)" opacity=".32"/></svg><div class="dot"></div>';
        o.me=new maplibregl.Marker({element:el,rotationAlignment:"map"}).setLngLat([me.lon,me.lat]).addTo(o.map);
      } else o.me.setLngLat([me.lon,me.lat]);
      mlCone(o);
    } else if(o.me){ o.me.remove(); o.me=null }
    o.map.getSource("me").setData({type:"FeatureCollection",features:f});
  }
  function mlCone(o){
    if(!o||!o.me) return;
    var c=o.me.getElement().querySelector(".cone");
    if(heading===null){ c.style.display="none"; return }
    c.style.display="block"; o.me.setRotation(heading);
  }

  // Камерата на голямата карта: около теб (и те следва), цялата разходка, или свободно.
  function mlCamera(o,animate,fresh){
    if(!o||!o.ready) return;
    if(ML.mode==="all"){ o.map.fitBounds(mlTrackBounds(),{padding:24,animate:!!animate}); return }
    if(ML.mode!=="me") return;
    var c=me?[me.lon,me.lat]:(view>=0?[GEO[view].lon,GEO[view].lat]:[GEO[0].lon,GEO[0].lat]);
    // ~340 м напряко при отваряне; после пази увеличението, което човекът си е избрал с пръсти
    var z=fresh?15.9:o.map.getZoom();
    if(animate) o.map.easeTo({center:c,zoom:z,duration:600}); else o.map.jumpTo({center:c,zoom:z});
  }

  function mlStrip(host){
    if(!ML.strip){ ML.strip=mlMake(host,false) }
    else if(ML.strip.el.parentNode!==host){ host.appendChild(ML.strip.el) }
    var o=ML.strip;
    requestAnimationFrame(function(){ o.map.resize(); o.map.fitBounds(mlTrackBounds(),{padding:{top:22,bottom:50,left:14,right:14},animate:false}); });
    mlState(o);
  }

  function mlSheet(host){
    if(ML.sheet&&ML.sheet.el.parentNode===host){ mlState(ML.sheet); mlMe(ML.sheet); return }
    if(ML.sheet){ try{ML.sheet.map.remove()}catch(e){} }
    var o=ML.sheet=mlMake(host,true);
    o.map.on("load",function(){ mlCamera(o,false,true) });
    // Човекът мести картата с пръст → спираме да я водим след него, докато не бутне „Около мен“.
    o.map.on("dragstart",function(){ ML.mode="free"; mlZoomBtn() });
    o.map.on("zoomstart",function(e){ if(e.originalEvent&&ML.mode==="all"){ ML.mode="free"; mlZoomBtn() } });
  }
  // Началният екран: селото с трите разходки в цветовете им, неподвижна — само за поглед.
  function mlHome(host){
    if(!host) return;
    if(!ML.ok){ host.innerHTML=""; return }
    mlHomeOff();
    var o=ML.home=mlMake(host,false,13); o.home=true;   // 13 — за да се побере и №2 до водопадите
    o.map.on("load",function(){
      var fs=[], b=[[180,90],[-180,-90]];
      CATALOG.forEach(function(w){
        var lv=w.level&&LEVEL[w.level];
        ML.data.features.forEach(function(f){
          if(f.properties.k!=="walked"||f.properties.f.indexOf(w.gpx)!==0) return;
          fs.push({type:"Feature",properties:{c:lv?lv.c:"#8B918A",soon:w.ready?0:1},geometry:f.geometry});
          f.geometry.coordinates.forEach(function(p){ b[0][0]=Math.min(b[0][0],p[0]); b[0][1]=Math.min(b[0][1],p[1]); b[1][0]=Math.max(b[1][0],p[0]); b[1][1]=Math.max(b[1][1],p[1]) });
          var el=document.createElement("div"); el.className="ml-wnum"; el.textContent=w.n; el.style.background=lv?lv.c:"#8B918A";
          new maplibregl.Marker({element:el}).setLngLat(f.geometry.coordinates[0]).addTo(o.map);
        });
      });
      o.map.getSource("walks").setData({type:"FeatureCollection",features:fs});
      o.map.resize();
      if(fs.length) o.map.fitBounds(b,{padding:28,animate:false});
    });
  }
  // Карта на мястото: приближена около него, с маршрута на №1 за ориентир и карфица.
  function mlPlace(host,p){
    if(!host||!ML.ok) return;
    mlPlaceOff();
    var o=ML.place=mlMake(host,false);
    o.map.on("load",function(){
      o.map.resize(); o.map.jumpTo({center:[p.lon,p.lat],zoom:16.4});
      var el=document.createElement("div"); el.className="ml-pin";
      new maplibregl.Marker({element:el}).setLngLat([p.lon,p.lat]).addTo(o.map);
    });
  }
  function mlPlaceOff(){ if(ML.place){ try{ML.place.map.remove()}catch(e){} ML.place=null } }
  function mlHomeOff(){ if(ML.home){ try{ML.home.map.remove()}catch(e){} ML.home=null } }
  function mlSheetClose(){ if(ML.sheet){ try{ML.sheet.map.remove()}catch(e){} ML.sheet=null } }
  function mlZoomBtn(){
    var z=document.getElementById("zoombtn");
    if(z) z.textContent=ML.mode==="me"?"Цялата разходка":"Около мен";
  }

  // Темата се сменя (светла/тъмна) → пребоядисваме.
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){
    if(ML.home) mlHome(document.getElementById("homemap"));
    [ML.strip,ML.sheet].forEach(function(o){ if(o&&o.ready){ o.ready=false; o.map.setStyle(mlStyle(),{diff:false}); o.map.once("style.load",function(){ o.ready=true; mlState(o); mlMe(o) }) } });
  }) }catch(e){}

  function paintLive(){
    if(view<0||view>=TEXT.length){ liveBar.hidden=true; return }
    liveBar.hidden=false;
    var cls="live", txt="", far="";
    if(denied){ cls+=" dead"; txt="Няма местоположение · <b>опитайте пак</b>"; }
    else if(!trackOn){ cls+=" dead"; txt="Следенето е изключено · <b>включете</b>"; }
    else if(!me){ cls+=" searching"; txt="Търся сателитите…"; }
    else{
      var dHere=distTo(GEO[view]);
      far="±"+me.acc+" м";
      if(!arrived){
        cls+= dHere<=thrFor(view)?" near":"";
        txt = dHere<=thrFor(view) ? "<b>Почти стигнахте</b>" : "До спирка "+(view+1)+" · <b>"+fmtDist(dHere)+"</b>";
      } else if(view>=TEXT.length-1){
        cls+= dHere<=ARRIVE?" near":"";
        txt = dHere<=ARRIVE ? "<b>Стигнахте края</b>" : "Последната спирка · <b>"+fmtDist(dHere)+"</b>";
      } else if(dHere<=ARRIVE){
        cls+=" near"; txt="<b>Вие сте тук</b>";
      } else {
        txt="До спирка "+(view+2)+" · <b>"+fmtDist(distTo(GEO[view+1]))+"</b>";
      }
    }
    liveBar.className=cls;
    liveBar.innerHTML='<span class="pip"></span><span>'+txt+'</span>'+(far?'<span class="far">'+far+'</span>':'');
  }

  /* ---------- сигнали ----------
     iPhone не позволява на уеб страници да вибрират, затова всеки сигнал
     е и кратък тон. Звукът се отключва от първото докосване („Тръгвам“) —
     браузърите не пускат звук без действие на човека. На iPhone тонът
     не се чува, ако телефонът е на беззвучен режим.                     */
  var AC=null;
  function unlockSound(){
    try{ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); }
         if(AC&&AC.state==="suspended") AC.resume(); loadBirds(); }catch(e){}
  }
  function tones(list){   // list: [[честота, продължителност_сек], ...]
    try{ if(!AC) return; var t=AC.currentTime+0.02;
      list.forEach(function(p){
        var o=AC.createOscillator(), g=AC.createGain();
        o.type="sine"; o.frequency.value=p[0];
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+p[1]);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+p[1]+0.02);
        t+=p[1]+0.08;
      });
    }catch(e){}
  }
  function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p) }catch(e){} }
  /* Звуците при пристигане (от 30.09.2026):
     спирка — часовник-кукувица, два сигнала (от Pixabay, файлът на потребителя е в ЗАПИСИАУДИОот-потребителя);
     спирка 5 — петел (от Pixabay, също там);
     завой — велосипеден звънец (синтезиран от нас, 30.09) — завоят звучи различно,
     защото там се губят хората. Предупреждението остава тон — то не бива да звучи приятно.
     Ако записът не се е заредил — тон.                                                     */
  var BIRD={stop:"audio/kukuvica.wav", turn:"audio/zvanec.wav", petel:"audio/petel.wav"}, BUF={};
  var STOP_SOUND={4:"petel"};              // спирка (от 0) → свой звук вместо кукувицата; 4 = спирка 5
  function loadBirds(){
    if(!AC) return;
    Object.keys(BIRD).forEach(function(k){
      if(BUF[k]) return;
      try{ fetch(BIRD[k]).then(function(r){ return r.arrayBuffer() }).then(function(b){
        AC.decodeAudioData(b,function(buf){ BUF[k]=buf },function(){});
      }).catch(function(){}); }catch(e){}
    });
  }
  function bird(k,fallback){
    try{ if(AC&&BUF[k]){ var src=AC.createBufferSource(), g=AC.createGain(); src.buffer=BUF[k]; g.gain.value=0.9;
      src.connect(g); g.connect(AC.destination); src.start(); return; } }catch(e){}
    tones(fallback);
  }
  var SIG={
    stop:  function(){ vib([35,55,35]);           bird("stop",[[880,.14]]); },
    turn:  function(){ vib([90,70,90,70,90]);     bird("turn",[[880,.12],[1175,.18]]); },
    lost:  function(){ vib([250,120,250,120,250]); tones([[440,.22],[440,.22],[440,.22]]); }
  };
  // при пристигане: завоят звучи различно, защото там се губят хората
  function buzz(){
    var s=TEXT[view];
    if(STOP_SOUND[view]){ vib([35,55,35]); bird(STOP_SOUND[view],[[880,.14]]); return; }
    (s&&(s.t==="turn"||s.dir)?SIG.turn:SIG.stop)();       // завой или спирка с посока → звънец
  }
  function arriveMsg(n){ return (TEXT[n].t==="turn"?"Завой · ":"Спирка "+(n+1)+" · ")+TEXT[n].title; }

  /* ---------- отклонение от маршрута ----------
     Ако си на повече от 40 м от следата поне 30 секунди — сигнал и надпис.
     Не звъни: при лоша точност (над 30 м), на корицата и на финала, и близо
     до текущата или следващата спирка — спирка 11 (плочата) е нарочно на
     60 м встрани от пътя. Звъни веднъж; следващият път — едва след като
     си се върнал на пътя.                                                  */
  var OFF_M=40, OFF_MS=30000, offSince=0, offWarned=false;
  function distToTrack(la,lo){
    var k=Math.cos(la*Math.PI/180), best=1e9;
    for(var i=1;i<TRACK.length;i++){
      var ax=(TRACK[i-1][1]-lo)*111320*k, ay=(TRACK[i-1][0]-la)*110540;
      var bx=(TRACK[i][1]-lo)*111320*k,   by=(TRACK[i][0]-la)*110540;
      var dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L)):0;
      var px=ax+t*dx, py=ay+t*dy, d=Math.sqrt(px*px+py*py);
      if(d<best) best=d;
    }
    return best;
  }
  function checkRoute(){
    if(!me||!trackOn||view<0||view>=TEXT.length-1||me.acc>30){ offSince=0; return }
    var nearStop = distTo(GEO[view])<60 || distTo(GEO[view+1])<60;
    var off = !nearStop && distToTrack(me.lat,me.lon)>OFF_M;
    if(!off){ offSince=0; if(distToTrack(me.lat,me.lon)<25) offWarned=false; return }
    if(!offSince) offSince=Date.now();
    if(!offWarned && Date.now()-offSince>=OFF_MS){
      offWarned=true; SIG.lost(); toast("Отклонихте се от маршрута · вижте картата");
    }
  }
  function toast(t){
    var el=document.createElement("div"); el.className="toast"; el.textContent=t;
    document.querySelector(".phone").appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.remove() },2900);
  }

  // Само напред и по една спирка. Маршрутът се връща покрай себе си —
  // спирка 2 и спирка 12 са на пет метра, затова „най-близката“ би било грешно.
  function maybeAdvance(){
    if(!me||!trackOn||view<0) return;
    if(me.acc>ACC_MAX) return;
    if(Date.now()-lastAdv<COOLDOWN) return;
    if(!arrived){                                   // на път към view
      if(distTo(GEO[view])<=thrFor(view)) arriveAt(view,true);
      return;
    }
    if(view>=TEXT.length-1) return;                 // при view, но вече вървите нататък
    var n=view+1, dn=distTo(GEO[n]);
    if(dn<=thrFor(n) && dn<distTo(GEO[view])) arriveAt(n,true);
  }

  function paintStrip(){
    var st=document.getElementById("strip");
    st.hidden=false;
    st.className="mapstrip"+(stripOn?"":" mini");
    document.getElementById("mapBtn").textContent=stripOn?"Скрий":"Карта";
    var sm=document.getElementById("stripmap");
    if(!stripOn) sm.innerHTML="";
    else if(ML.ok){ if(sm.querySelector("svg")) sm.innerHTML=""; mlStrip(sm) }
    else sm.innerHTML=mapSVG("s",false);
    paintMe();
  }

  function toggleStrip(){
    stripOn=!stripOn;
    try{localStorage.setItem(SKEY,stripOn?"1":"0")}catch(e){}
    paintStrip();
  }

  var mapZoom=true;   // голямата карта се отваря приближена — там е смисълът ѝ

  function redrawSheet(){
    var w=document.getElementById("sheetmap");
    if(!w) return;
    if(ML.ok){
      if(w.querySelector("svg")) w.innerHTML="";
      mlSheet(w); mlZoomBtn(); paintMe(); return;
    }
    w.innerHTML=mapSVG("b",mapZoom);
    var z=document.getElementById("zoombtn");
    if(z) z.textContent=mapZoom?"Цялата разходка":"Около мен";
    paintMe();
  }

  function openMap(){
    var sh=document.createElement("div");
    sh.className="sheet";
    sh.innerHTML='<header><h2>Къде съм</h2>'+
        '<span class="tools"><button class="iconbtn" type="button" id="zoombtn">Цялата разходка</button>'+
        '<button class="iconbtn" type="button" data-close>Затвори</button></span></header>'+
      '<div class="body"><div class="mapwrap" id="sheetmap">'+(ML.ok?"":mapSVG("b",mapZoom))+'</div>'+
      '<div class="legend">'+
        '<i><b style="background:var(--live)"></b>вие</i>'+
        '<i><b style="background:var(--door)"></b>тази спирка</i>'+
        '<i><b style="background:var(--ink-faint)"></b>минати</i>'+
        '<i><b style="background:var(--surface-2);box-shadow:0 0 0 1px var(--ink-faint)"></b>напред</i>'+
      '</div>'+
      '<div class="gps">'+
        '<p class="gpsprog" id="gpsprog"></p>'+
        '<p class="gpsmsg" id="gpsmsg">'+(trackOn
          ? 'Търся сателитите…'
          : 'Бутнете „Включи следенето“ и телефонът ще поиска местоположението ви.')+'</p>'+
        (trackOn?'':'<button class="btn primary wide" id="findme" type="button">Включи следенето</button>')+
      '</div></div>';
    sh.addEventListener("click",function(e){
      if(e.target.closest("[data-close]")){ mlSheetClose(); sh.remove(); wakeOff(); return }
      if(e.target.closest("#zoombtn")){
        if(ML.ok){ ML.mode=(ML.mode==="me")?"all":"me"; mlZoomBtn(); mlCamera(ML.sheet,true,true); return }
        mapZoom=!mapZoom; redrawSheet(); return
      }
      if(e.target.closest("#findme")){ startTracking(true); mlSheetClose(); sh.remove(); openMap(); }
    });
    document.querySelector(".phone").appendChild(sh);
    ML.mode="me";                         // голямата карта винаги се отваря около теб
    redrawSheet();
    wakeOn();
  }

  /* ---------- будност и наваксване ----------
     Уеб страница не може да следи GPS при изгасен екран — браузърът я приспива.
     Затова: (1) докато е отворена голямата карта, екранът не угасва сам;
     (2) щом телефонът се отключи, питаме веднага къде си и прескачаме на
     спирката, до която си стигнал — до три напред, не повече, защото
     маршрутът се връща покрай себе си (спирки 2 и 12 са на пет метра). */
  var wakeLock=null;
  function wakeOn(){
    try{ if(!navigator.wakeLock||wakeLock) return;
      navigator.wakeLock.request("screen").then(function(l){ wakeLock=l; l.addEventListener("release",function(){ wakeLock=null }); }).catch(function(){});
    }catch(e){}
  }
  function wakeOff(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null } }catch(e){} }

  function catchUp(){
    if(!me||view<0||me.acc>ACC_MAX) return;
    var from=arrived?view+1:view;
    for(var k=Math.min(view+3,TEXT.length-1); k>=from; k--){
      if(distTo(GEO[k])<=thrFor(k)){ arriveAt(k,true); return; }
    }
  }

  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState!=="visible") return;
    if(document.getElementById("sheetmap")) wakeOn();   // браузърът пуска будността при скриване
    if(!trackOn||!navigator.geolocation) return;
    startTracking(true);                                // някои телефони спират следенето насън
    navigator.geolocation.getCurrentPosition(function(pos){
      me={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:Math.max(1,Math.round(pos.coords.accuracy))};
      paintMe(); catchUp();
    },function(){},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  });

  function startTracking(quiet){
    if(!navigator.geolocation){ denied=true; if(!quiet) render(); else paintLive(); return }
    trackOn=true; denied=false;
    try{localStorage.setItem(TKEY,"1")}catch(e){}
    if(watchId!==null) navigator.geolocation.clearWatch(watchId);
    watchId=navigator.geolocation.watchPosition(function(pos){
      me={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:Math.max(1,Math.round(pos.coords.accuracy))};
      var hd=pos.coords.heading, sp=pos.coords.speed;
      if(typeof hd==="number"&&!isNaN(hd)&&sp>0.6&&Date.now()-compassAt>3000) heading=hd;
      paintMe(); maybeAdvance(); checkRoute();
      var nf=document.getElementById("ncfar");
      if(nf&&view<GEO.length-1) nf.textContent=fmtDist(distTo(GEO[view+1]))+(GEO[view].walk?" · около "+GEO[view].walk+" мин":"");
      // приближената карта върви след теб
      if(mapZoom && document.getElementById("sheetmap")) redrawSheet();
    },function(err){
      me=null;
      if(err.code===1){ denied=true; trackOn=false; try{localStorage.setItem(TKEY,"0")}catch(e){} }
      paintMe();
      var msg=document.getElementById("gpsmsg");
      if(msg) msg.textContent = err.code===1
        ? "Не дадохте разрешение за местоположение. Включва се от настройките на браузъра."
        : "Не мога да ви намеря. Излезте на открито и опитайте пак.";
      if(!quiet&&view<0) render();
    },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
    if(quiet) paintLive(); else render();
  }

  function openList(){
    var sh=document.createElement("div");
    sh.className="sheet";
    sh.innerHTML='<header><h2>Спирките</h2><button class="iconbtn" type="button" data-close>Затвори</button></header>'+
      '<div class="body">'+TEXT.map(function(s,i){
        var d=me?'<em class="dist">'+fmtDist(haversine(me.lat,me.lon,GEO[i].lat,GEO[i].lon))+'</em>'
               :(s.t==="turn"?'<em>завой</em>':'');
        return '<button class="row'+(i===view?" current":"")+'" type="button" data-jump="'+i+'">'+
          '<i>'+(i+1)+'</i><b>'+esc(s.title)+'</b>'+d+'</button>';
      }).join("")+
      // мястото ви в разходката се пази — от началния екран се продължава оттук
      '<button class="row tohome" type="button" data-home><i>←</i><b>Към началния екран</b><em class="dist">всички разходки</em></button>'+
      '</div>';
    sh.addEventListener("click",function(e){
      if(e.target.closest("[data-close]")){ sh.remove(); return }
      if(e.target.closest("[data-home]")){ sh.remove(); home=true; dir=-1; render(); return }
      var j=e.target.closest("[data-jump]");
      if(j){ sh.remove(); go(parseInt(j.getAttribute("data-jump"),10)) }
    });
    document.querySelector(".phone").appendChild(sh);
  }

  actions.addEventListener("click",function(e){
    var t=e.target.closest("button"); if(!t)return;
    unlockSound();
    // „Тръгвам“ е моментът, в който има право да поиска местоположение и компас
    if(t.id==="next"){ nextAction(); return; }
    if(t.id==="prev"){ prevAction(); return; }
    if(t.id==="restart"){ view=-1; arrived=true; home=true; dir=-1; render(); }
  });

  liveBar.addEventListener("click",function(){
    startCompass();
    if(!trackOn) startTracking(true); else openMap();
  });

  rail.addEventListener("click",function(e){
    var t=e.target.closest("[data-jump]"); if(!t)return;
    go(parseInt(t.getAttribute("data-jump"),10));
  });
  document.getElementById("mapBtn").addEventListener("click",toggleStrip);
  document.getElementById("listBtn").addEventListener("click",openList);
  // бутоните и етикетът стоят върху картата — те си имат свои действия
  document.getElementById("strip").addEventListener("click",function(e){ if(!e.target.closest("button")) openMap(); });
  document.getElementById("mapBtn").addEventListener("click",function(e){ e.stopPropagation(); });
  document.getElementById("listBtn").addEventListener("click",function(e){ e.stopPropagation(); });

  scroll.addEventListener("click",function(e){
    var pl=e.target.closest("[data-place]");
    if(pl){ openPlace(pl.getAttribute("data-place")); return; }
    var wk=e.target.closest("[data-walk]");
    if(wk&&!wk.disabled){ home=false; dir=1; render(); return; }   // засега има една готова; изборът на разходка е в етап 4
    if(e.target.closest("#playbtn")){
      unlockSound();
      var a=audEl();
      if(a.getAttribute("data-i")===String(view)&&!a.paused) a.pause(); else playFor(view);
      return;
    }
    var im=e.target.closest("img");
    if(im&&!e.target.closest(".crest")&&!e.target.closest(".colophon")){
      document.getElementById("lbimg").src=im.src; document.getElementById("lb").classList.add("on");
    }
  });
  document.getElementById("lb").addEventListener("click",function(){ this.classList.remove("on") });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ document.getElementById("lb").classList.remove("on"); return }
    if(e.key==="ArrowRight")nextAction();
    if(e.key==="ArrowLeft")prevAction();
  });

  var x0=null,y0=null;
  scroll.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  scroll.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.8){ if(dx<0) nextAction(); else prevAction(); }
    x0=null;
  },{passive:true});

  mlLoad();
  render();
  if(trackOn) startTracking(true);
})();
</script>

<div id="upd" hidden style="position:fixed;left:0;right:0;top:0;z-index:70;display:flex;justify-content:center;padding:10px 12px;pointer-events:none">
  <button type="button" id="updbtn" style="pointer-events:auto;border:none;border-radius:999px;padding:11px 18px;background:var(--door);color:var(--on-door);font:600 14.5px var(--sans);box-shadow:0 8px 24px -8px rgba(0,0,0,.4)">Има нова версия · Презареди</button>
</div>
<script>
var APPVER="razhodka1-v17", SHOW_UPDATE=false, OFFLINE_FILES=["./","./index.html","./manifest.webmanifest","./icon-192.png","./icon-512.png","./apple-touch-icon.png","./img/carkva.jpg","./img/cheshma.jpg","./img/hram.jpg","./img/johan.jpg","./img/levski.jpg","./img/patq.jpg","./img/plocha.jpg","./img/rajna.jpg","./img/shiroko.jpg","./img/sini.jpg","./img/sredishte.jpg","./img/ulichka.jpg","./img/vazov.jpg","./audio/kukuvica.wav","./audio/petel.wav","./audio/razdumka.m4a","./audio/zvanec.wav","./map/dem/14/9320/6018.png","./map/dem/14/9320/6019.png","./map/dem/14/9321/6018.png","./map/dem/14/9321/6019.png","./map/maplibre-gl.css","./map/maplibre-gl.js","./map/selo.json"];
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
    // Готово ли е за път без интернет? Снимките и записите вече са отделни файлове
    // и service worker-ът ги тегли отзад. Проверяваме кеша и казваме на човека.
    // На корицата надписът е в #offline (текстът е в CSS, по data-offline).
    (function check(n){
      if(!window.caches) return;
      caches.open(APPVER).then(function(c){
        return Promise.all(OFFLINE_FILES.map(function(f){ return c.match(f); }));
      }).then(function(hits){
        var ok=hits.every(function(h){ return !!h; });
        document.documentElement.setAttribute('data-offline', ok?'ready':'loading');
        if(!ok&&n<60) setTimeout(function(){ check(n+1); }, 2000);
      }).catch(function(){});
    })(0);
    // Service worker-ът подава страницата от кеша, за да работи офлайн. Затова след
    // качване първото отваряне е старото. Тук питаме мрежата коя е текущата версия
    // и ако е различна — предлагаме презареждане. Без обхват проверката мълчи.
    if(!SHOW_UPDATE||navigator.onLine===false) return;
    fetch('sw.js?v='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(t){
      var m=/CACHE\s*=\s*"([^"]+)"/.exec(t||'');
      if(!m||m[1]===APPVER) return;
      var box=document.getElementById('upd');
      box.hidden=false;
      document.getElementById('updbtn').addEventListener('click',function(){
        this.textContent='Зарежда се…';
        var go=function(){ location.reload(); };
        if(window.caches&&caches.keys){
          caches.keys().then(function(k){ return Promise.all(k.map(function(x){ return caches.delete(x); })); }).then(go,go);
        } else go();
      });
    }).catch(function(){});
  });
}
</script>
</body>
